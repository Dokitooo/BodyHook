; BodyHook.ini  - goes next to nba2k14.exe (same folder as dinput8.dll)
; Settings take effect the next time you start the game. (png files are re-read live.)

[BodyHook]
; 1 = patch the game. 0 = load, log what it finds, change nothing.
Enabled=1

; Write BodyHook.log next to nba2k14.exe (overwritten every launch).
Log=1

; 0 = log each player/body combination once. 1 = log every single body request (big log).
LogEveryLookup=0

; 1 = extra detail for troubleshooting: the list of every loaded .iff container on the
;     first two body requests, one line per player/garment about moving cloth, and every
;     shared uniform model identified. Costs a little time in menus - leave 0 for play.
Diagnostics=0

; If the player's pngXXXX.iff has no row for the FileID his roster bodytype asks for,
; also accept any of the other 3 standard body rows found in HIS png.
;   1 = a png with a 4A610FDA (hi_body) row gives that body even if the roster says skinny/fat/muscular
;   0 = the png row must match the roster bodytype exactly
MatchAnyBodyID=1

; 1 = players without a body in their own png get the body from global.iff ONLY.
;     This is what stops one player's custom body leaking onto everybody else.
; 0 = use the game's original "first container that has it" search (the old overlap behaviour).
StrictGlobalFallback=1

; Container that holds the stock bodies. The game calls global.iff "GLOBAL".
FallbackContainer=GLOBAL

; Optional: extra body FileIDs to look for inside a player's own png (after the roster one).
; Use this if you give your cloned SCNE row a UNIQUE FileID in RED MC instead of 4A610FDA.
; Accepts names (hashed like the game does) or 8-digit FileIDs as RED MC shows them.
;   ExtraBodyIDs=hi_body_custom, 1A2B3C4D
ExtraBodyIDs=

; ---- Leg tattoos ----
; 1 = a TXTR row with one of the FileIDs below inside a player's pngXXXX.iff gives that player
;     his own leg texture; players without one use global.iff. 0 = stock behaviour.
LegTattoos=1

; The game picks one of these leg textures per player. With MatchAnyLegID=1, whichever of
; them you put in a png is used, even if the game picked a different number.
MatchAnyLegID=1

; Names (hashed like the game does) or FileIDs as RED MC shows them.
LegTattooIDs=legs_00_color, legs_01_color, legs_02_color, legs_03_color, legs_04_color, legs_05_color

; Speed: at startup BodyHook reads which loose pngXXXX.iff files (next to the exe) have
; custom body/uniform rows. Players whose png has none are skipped instantly (no searching).
; Set 0 only if you load custom pngs from somewhere other than the game folder.
FastPngCheck=1

; If a player's loose png HAS a body/leg row but the game's container does not return it
; (usually because the png is still loading, e.g. when paging through Edit Player), wait up to
; this many milliseconds for it. A "MISS" line in the log means it still was not there.
PngLoadWaitMs=150

; 1 = when a loose pngXXXX.iff is saved while the game runs (IFF Mod Studio, RED MC),
;     BodyHook reads its rows again (checked at most once a second per png), so new
;     body / leg / uniform / accessory rows work without restarting the game.
;     Close and reopen Edit Player (or reload the player) to see them.
LivePngRefresh=1

; How long to wait for the game code to be unpacked before giving up (seconds).
WaitForGameSeconds=180

[Uniforms]
; ---- Jersey / shorts models ----
; A SCNE row with one of these FileIDs inside a player's pngXXXX.iff replaces the jersey/shorts
; MODEL for that player only. Players without such a row keep the models from the cloth_*.iff
; files in the game folder. 0 = stock behaviour.
Enabled=1

; The game picks the size from the roster bodytype: skinny -> thin, fat -> fat,
; normal and muscular -> reg. With MatchAnyInGroup=1 a png only needs ONE row per garment:
; if the exact size isn't in the png, another size of the same garment from the png is used.
; Jerseys are matched per neck style: a png with only U-neck rows does not change a V-neck jersey.
MatchAnyInGroup=1

; The game's cloth files may be MOVING (with ClothMesh rows). A png model is static, so the
; global ClothMesh does not fit it. 1 = players whose png supplies the jersey/shorts get NO cloth
; simulation for that garment (drawn exactly like a nonmoving cloth file); everyone else keeps
; moving cloth. 0 = old behaviour (grey/broken uniform with moving cloth files).
DisableClothSimForPngModels=1

; The game rebuilds its shared uniform models (e.g. when entering Edit Player) with the
; "first file that has it" search. 1 = pngs are skipped there, so a png uniform can never
; become everybody's uniform.
KeepPngsOutOfSharedCache=1

; Garment groups (names are hashed like the game does, or 8-digit FileIDs).
JerseyU=jersey_u_reg, jersey_u_thin, jersey_u_fat
JerseyV=jersey_v_reg, jersey_v_thin, jersey_v_fat
JerseyWishbone=jersey_wishbone_reg, jersey_wishbone_thin, jersey_wishbone_fat
Shorts=shortsreg, shortsthin, shortsfat

; Players whose jersey/shorts come from their own png are static (no moving cloth). 1 = they are
; never drawn with someone else's moving cloth (fixes the stretched cloth in practice mode). 0 = off.
StaticClothGuard=1

[Accessories]
; Per-player accessory textures, same rule as leg tattoos: if a player's own
; cyberface png (pngXXXX.iff) has the accessory texture row, that player uses it;
; everyone else keeps the texture from global.iff. Add the row in RED MC with the
; same FileID as in global.iff.
Enabled=1

; Wear accessories together. The stock game hides one accessory when another
; slot is equipped (arm sleeve under a shirt sleeve, leg sleeve under a knee pad,
; arm sleeve with an elbow pad...). 1 = every equipped slot is drawn.
; If the game swaps a model for another version of the SAME accessory (long sleeves
; become short sleeves with some wrist accessories), the game's version is kept so
; two versions are never drawn on top of each other. 0 = stock behaviour.
AllowCombinations=1

; NBA 2K12: an elbow sleeve hides the arm parts under it (body parts 0-9 / 0-10), so the elbow
; looks cut out. 1 = elbow sleeves keep those parts visible (default), 2 = elbow pads too,
; 0 = stock. NBA 2K12 only.
KeepArmUnderElbowSleeve=1

; Accessory texture FileIDs as RED MC shows them (8 hex digits, max 64). Default =
; every accessory texture in the stock game: headband, undershirt, shirts, sleeves,
; pads, bands, straps, wraps, shorts, socks.
; Per-player NORMAL MAPS for the same accessories. The game asks for each accessory's
; normal map as its texture name + "_n" (elbowsleeve 04633A86 -> elbowsleeve_n 7D25FD27);
; BodyHook works those FileIDs out from TextureIDs. A png can replace the texture, the
; normal map, or both - each independently. 0 = normal maps always from global.iff.
NormalMaps=1

; Normal maps that do NOT follow the "_n" rule. Default: the headband's
; unif_headband_normal (5779DBB0).
ExtraNormalIDs=5779DBB0

TextureIDs=46A48CA9, 284C68D8, 1FC834CE, 14BFDBB5, 7E289AFF, 6FF4EC60, 6CD24D44, 38731057, 0F6B2638, 7B411638, 04633A86, 6AEF61FE, B05BC4DA, B6BD4971, D646D276, 8E96C7EE, 975511F2, FBB9E735, 841EDB78, D69642A5, 98DF9350, 0E46C401, C74FF2BB, E9E01C61, EBB16072, 5D691AD4, F9667DCC, F488BB8C, E1A4D030, 60FE8AD8, 34A12BB6, 19C1C1B0, F5080DB7, 6430046B, C884A024, 5D507EC5, C8791905, E79D0E40, C452025A, 511CF131, 9EEE8F94, 7B24B4A0, B4D6CA05, 45E26204, BC03E907, 81DA22CA

[CoachPolo]
; Coaches wear the polo that is hidden inside every body model instead of the suit jacket.
; 0 = stock suit jacket (default). Changes take effect the next time you start the game.
Enabled=0

; Texture for the polo (8-digit FileID as RED MC shows it, or an asset name).
; Default: coach_suit_colorize / coach_suit_normal from global.iff. Replace those rows to
; repaint the polo, or give your own FileIDs here.
Texture=F0752759
NormalMap=A5FD6D9F

; 1 = coaches always show both whole arms: the arm skin is drawn for coaches and every arm
; part is shown (fixes coaches missing arm parts in MyCareer, and shows the arms below the
; polo sleeves - also when your body models already have the polo built in). Meant for the
; polo look; with a real suit jacket the arms sit inside the sleeves. Players never affected.
; 0 = stock (default).
ShowArms=0

[NBAPatch]
; 1 = the NBA logo patch texture (unif_nbapatch, 0DAE36BF) is used ONLY on headbands.
;     Jerseys, shorts, socks and everything else get no NBA patch (all_black, the game's
;     own "no logo" texture). 0 = stock.
HeadbandOnly=1

[TeamColorSocks]
; Every sock type takes the team colours, like the striped long socks do.
; 0 = stock socks. Changes take effect the next time you start the game.
Enabled=1

; Sock textures are colour masks: red / green / blue channel = colour 1 / 2 / 3.
;   1 = red Team 1, green Team 2, blue = sock colour (white/black from the uniform)
;       (same as the striped long socks; stock socks turn Team 1)
;   2 = red = sock colour, green Team 1, blue Team 2
;       (stock socks stay white/black; only what you paint green/blue gets team colours)
Style=1

; Sock texture FileIDs that get team colours (all = every sock type).
; ankle, short, short double, medium, medium double, medium long, long
Socks=C452025A, 511CF131, 9EEE8F94, 7B24B4A0, B4D6CA05, 45E26204, BC03E907

; OTHER accessory textures that get the same team colours (same Style as above). Any
; accessory texture FileID from the cheat sheet, e.g. 6AEF61FE (wrist band), 5D691AD4 (leg
; sleeve). Empty = none (default). Paint the texture as a colour mask like the socks.
; Needs [Accessories] Enabled=1.
Accessories=

; Every listed sock/accessory is coloured like the STRIPED LONG SOCKS:
;   red/green texture: green = Team 2, red = Team 1, blue = sock colour (white/black)
;   red/blue texture:  red = Team 2, blue = Team 1   (the "non rgb" export - same look)
; 1 = BodyHook reads each texture once from its .iff file (png / global.iff)
;     and picks the right one; the log shows
;     "TEAMCOLOR texture ... red/blue layout" or "red/green layout". 0 = no check.
DetectStockMasks=1
; Force the layout for textures the check gets wrong (FileIDs, comma separated).
; A FileID in RedGreenTextures is always used as it is (no swap):
RedBlueTextures=
RedGreenTextures=

[HairStyles]
; Hair styles for REGULAR players (not created players).
; Put extra copies of a player's cyberface next to his png, named
;     png<CFID>_<anything>.iff      e.g.  png19600_hair1.iff, png19600_braids.iff
; Edit Player > Body & Head then shows a "Hair Style" row under Height and Weight:
;     Original, braids, hair1   (the part after the underscore, A-Z order)
; The one you pick is loaded instead of png<CFID>.iff for that player, everywhere
; (menus, games, replays). Choices are saved per CFID in BodyHook_Hair.ini.
; Created players keep the normal hair style list. 0 = off.
Enabled=1

; 1 = show the Hair Style row even for players without any png<CFID>_*.iff
; (it then only offers "Original"). 0 = hide it for them.
ShowWithoutVariants=0

; Name shown for png<CFID>.iff itself.
OriginalLabel=Original

; Live refresh (NBA 2K14): when you pick another Hair Style in Edit Player, the preview player
; is rebuilt right away so the new hair shows immediately (no saving and re-opening the player).
; The head camera is held still while the new head loads. Replaces the separate HairRefresh
; tool (do not run both). 0 = off (the pick then applies the next time the model loads).
LiveRefresh=1

[ShortLength]
; Edit Player > Body and Head (NBA 2K12: Body) gets a "Short Length" row right under Weight:
; 0 (shortest) .. 10 (longest), 5 = the shorts exactly as your cloth_shorts file has them. Regular
; players only (NBA 2K14 and NBA 2K12); the value is saved per player (CFID) in BodyHook_Shorts.ini and is used everywhere
; (menus, games, replays). Works on MOVING cloth_shorts (the cloth of that one player gets longer or
; shorter leg tubes; nothing shared is changed). NONMOVING (static) shorts keep their length - turn
; them into moving shorts with the Jersey Cloth Editor first. Needs [Uniforms] Enabled=1.
Enabled=1
; how far the hem moves per step, in percent of the shorts' height (4 = about 2.3 cm per step)
StepPercent=4

[Wingspan]
; NBA 2K14: Edit Player > Body and Head gets a "Wingspan" row right under Short Length:
; 0 (shortest arms) .. 10 (longest arms), 5 = the player's own arms. Upper arm + forearm get longer or
; shorter; the hands keep their shape. Regular players only; saved per player (CFID) in
; BodyHook_Wingspan.ini and used everywhere (Edit Player, menus, games, replays). The ball (and anything
; else held) moves with the hands; with both hands on the ball the hands stay together on it.
Enabled=1
; 10 = arms this many percent longer, 0 = this many percent shorter (5..25)
MaxPercent=15

[Bench]
; High-poly bench. Normally a substitute on the bench is drawn with the low-poly bench
; model (one shared body with a baked uniform + his lohead). 1 = bench players use the same
; model as on the court: his hihead, his own body, his jersey/shorts.
HighPolyBench=1
; Bench players in REPLAYS:
;   auto     = high-poly (with MOVING cloth only when BenchUniforms below is on)
;   highpoly = always high-poly
;   stock    = always the stock bench model in replays
ReplayBench=auto
; Jersey + shorts for bench players on the high-poly model. The game only gives cloth to the
; 10 players on the court; without it the court model draws NO jersey/shorts.
;   1 = real moving cloth for bench players too (BodyHook gives them their own cloth)
;   2 = static jersey/shorts without simulation (1.10.2 - did not follow the body)
;   3 = plain static draw
;   0 = off
BenchUniforms=1
; Coaches on the bench: 0 = stock bench model (default; their court model shows the polo
; outfit there), 1 = high-poly like the players.
Coaches=0
; 1 = write BENCHDIAG lines to BodyHook.log (what each bench player's model has)
Diagnostics=0

[EditPlayerCamera]
; Edit Player preview camera (1.11.10+). Each camera view can be zoomed: View<N>=factor scales its
; distance and height (1.0 = the game's own, 0.9 = 10% closer, 0.5 = twice as close).
;   View20 = Signature (the shot / animation previews), 1500 cm away
;   View0, View1 = Vitals / Body (full body), 450 cm away     View4 = head close-up
View20=0.6
; View<N>Lift = cm: moves the camera and the point it aims at up together, so the player sits lower
; on screen (taller players no longer touch the top). Signature only by default.
View20Lift=60
View0=0.9
View1=0.9
; this ini is re-read every second while the game runs: change a value, save, and see it right away
LiveReload=1
; log "EDIT CAMERA view N" when the camera view changes (tells which number a screen uses)
LogViews=1
; 0 = the game's own camera everywhere
Enabled=1
[Players]
; Optional per-cyberface rules. Key = CFID, value = off or a FileID/name.
;   1612=off             -> ignore the body inside png1612.iff (that player gets global.iff)
;   1612=hi_body_custom  -> use ONLY this FileID from png1612.iff
;   19600=4A610FDA
; Nothing is required here: by default every png with a body row is used automatically.
; Keys are the CFID the game loads png<CFID>.iff from (see [Advanced]).

[Advanced]
; Offsets found in nba2k14.exe (player -> cyberface object -> container hash).
; Only change these if a future log tells you to.
PlayerCyberfaceOffset=0x1F0
CyberfaceValidOffset=0x10
CyberfaceHashOffset=0x4168
; Which roster field is the CFID. "game" (default) = CF_ID, record +0x3C: the field the
; game itself builds png<CFID>.iff from, so BodyHook always reads the png the player really
; wears (MyCareer players and custom faces included). The old value 0x1C is PortrID (the
; portrait), which only equals CF_ID in stock rosters; it is upgraded to "game" automatically.
; "auto" = learn it from your custom-body pngs, or a hex offset to force one.
PlayerCFIDOffset=game
PlayerRecordSize=0x298
